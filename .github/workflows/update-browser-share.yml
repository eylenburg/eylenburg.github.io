name: Update browser market shares

on:
  schedule:
    # Run on the 1st of each month at 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update browser shares
        run: python scripts/update_browser_share.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Update browser market shares'
          title: 'Update browser market shares'
          body: |
            Automated update of browser usage share percentages from OpenStatsLab/statcounterdata (StatCounter data).

            Updates the date and the share values for Firefox, Safari, Chrome, Edge, Opera, and Brave. Charts are not modified.
          branch: update-browser-share
          delete-branch: true
