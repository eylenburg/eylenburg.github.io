name: Update Artificial Analysis Intelligence Index

on:
  schedule:
    # Every Sunday at 20:00 UTC (evening in Europe / afternoon in US)
    - cron: '0 20 * * 0'
  workflow_dispatch:  # allow manual runs

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Update AAII scores
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/update_aaii.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update Artificial Analysis Intelligence Index scores"
          title: "Update Artificial Analysis Intelligence Index scores"
          body: |
            Automated weekly update of Artificial Analysis Intelligence Index (AAII) scores on the AI providers table.

            - Fetches current data via the official Artificial Analysis free API.
            - Updates the top model and AAII score for each tracked creator.
            - Recomputes tiers 1–7 from the absolute score range of the updated entries.
            - Updates the source date next to the Artificial Analysis link.

            Source: [Artificial Analysis Intelligence Index](https://artificialanalysis.ai/leaderboards/models)
          branch: update-aaii
          delete-branch: true
